apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-rust}
  template:
    metadata:
      labels: {app: api-rust}
    spec:
      containers:
        - name: api-rust
          image: zot.local:5000/mumnk8s/rust-api:v1
          ports: [{containerPort: 8000}]
          env:
            - {name: GO_API_URL, value: "http://go-rest-api:8080/report"}
            - {name: ROUTE_PATH, value: "/grpc-202112674"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
  namespace: mumnk8s
spec:
  selector: {app: api-rust}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-rust-hpa
  namespace: mumnk8s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-rust
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 30}

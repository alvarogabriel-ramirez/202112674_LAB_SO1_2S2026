apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-route
  namespace: mumnk8s
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    - matches:
        - path: {type: PathPrefix, value: /grpc-202112674}
      backendRefs:
        - {name: api-rust, port: 8000}

# This rule is not used by the project mumn-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the operators.mumnk8s.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mumn-operator
    app.kubernetes.io/managed-by: kustomize
  name: valkeyinstance-editor-role
rules:
- apiGroups:
  - operators.mumnk8s.io
  resources:
  - valkeyinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operators.mumnk8s.io
  resources:
  - valkeyinstances/status
  verbs:
  - get

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey
        uid: valkey
        type: redis-datasource
        access: proxy
        url: redis://{{ .Values.valkeyHost }}:{{ .Values.valkeyPort }}
        isDefault: true
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10

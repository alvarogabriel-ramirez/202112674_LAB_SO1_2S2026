apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: mumnk8s
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
  mumnk8s.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}

# This rule is not used by the project mumn-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over operators.mumnk8s.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mumn-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafanainstance-admin-role
rules:
- apiGroups:
  - operators.mumnk8s.io
  resources:
  - grafanainstances
  verbs:
  - '*'
- apiGroups:
  - operators.mumnk8s.io
  resources:
  - grafanainstances/status
  verbs:
  - get
